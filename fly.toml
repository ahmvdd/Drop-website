# fly.toml app configuration file generated for drop-website on 2026-09-07T15:45:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'drop-website'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/waitlist.db'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
